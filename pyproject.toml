[project]
name = "feature-selection-playbook"
version = "0.2.0"
description = "Environment + the fsp package for the Feature Selection Playbook. Claude Code runs the screening guided by PLAYBOOK.md, calling the deterministic fsp tools; this file declares the package and every library it needs."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Ramacharan R", email = "ramacharan.r@feuji.com" }]
keywords = ["feature-selection", "eda", "leakage-detection", "all-relevant"]

# Everything Claude Code needs to run the playbook end to end. The agent writes
# the code; these are the libraries that code imports. Grouped by purpose.
dependencies = [
    # --- Data + IO (read whatever the dataset arrives as) ---
    "pandas>=2.3.3",
    "numpy>=2.3.5",
    "pyarrow>=25.0.1",          # parquet (ledger, frozen folds)
    "fastparquet>=2024.5.0",    # alternate parquet engine
    "openpyxl>=3.1",            # .xlsx
    "xlrd>=2.0",                # legacy .xls
    "pyreadstat>=1.2",          # SPSS/SAS/Stata (.sav/.sas7bdat/.dta)
    "charset-normalizer>=3.3",  # detect encoding of messy CSVs

    # --- Statistics + feature selection (§8 dispatch, §17 formulas) ---
    "scipy>=1.16.3",            # Spearman, Kendall, chi-square, Mann-Whitney, Kruskal-Wallis, point-biserial, csgraph, bootstrap
    "scikit-learn>=1.9.0",      # folds (Stratified/Group/TimeSeries), AUC/roc_auc, RandomForest, TargetEncoder
    "statsmodels>=0.14.6",      # Benjamini-Hochberg FDR, VIF, logistic regression
    "pingouin>=0.5.5",          # effect sizes + correlations with confidence intervals
    "Boruta>=0.4.3",            # all-relevant cross-check at Part H (§16)

    # --- Information Value / WoE / x-statistic via optimal binning (§17.2, §17.3) ---
    "optbinning>=0.21.0",

    # --- Survival: Cox screening, C-index, log-rank (§17.8) ---
    "lifelines>=0.30.3",

    # --- Graphs: connected components for co-missing (§D) and redundancy (§G) ---
    "networkx>=3.3",

    # --- Figures for the notebook ---
    "matplotlib>=3.10.0",
    "seaborn>=0.13",            # distribution / heatmap figures
    "plotly>=5.24",             # interactive figures (render in the notebook / HTML)
    "kaleido>=0.2.1",           # export plotly figures to static images

    # --- The documented results notebook (the deliverable, §14) ---
    "nbformat>=5.10.4",         # author results.ipynb
    "nbconvert>=7.16",          # also export a viewable results.html (no Jupyter needed to read it)
    "tabulate>=0.9.0",          # markdown tables the agent embeds
    "tqdm>=4.66",               # progress bars over 300-column loops
]

[project.scripts]
fsp = "fsp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "ipykernel>=6.29",       # open / run the produced notebook interactively
]

# ---------------------------------------------------------------------------
# The fsp package — the deterministic tools Claude Code calls (see TOOLS.md).
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fsp"]

# Bundle the guide docs into the wheel so `fsp init` / `fsp.scaffold()` can copy
# them into a user's project. Canonical copies stay at the repo root.
[tool.hatch.build.targets.wheel.force-include]
"CLAUDE.md" = "fsp/assets/CLAUDE.md"
"PLAYBOOK.md" = "fsp/assets/PLAYBOOK.md"
"TOOLS.md" = "fsp/assets/TOOLS.md"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"  # matches .python-version; numpy's stubs now require 3.12 parsing
packages = ["fsp"]
strict = true
ignore_missing_imports = true

# Untyped scientific libraries — treat as Any so strict mode doesn't choke on them.
[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "statsmodels.*", "lifelines.*", "optbinning.*", "boruta.*", "seaborn.*", "nbformat.*", "nbconvert.*", "pingouin.*", "networkx.*", "pyreadstat.*", "charset_normalizer.*", "matplotlib.*", "plotly.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
